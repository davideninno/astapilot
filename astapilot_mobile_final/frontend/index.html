<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AstaPilot — App-ready prototype</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#f5f6f8;color:#111827}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1240px;margin:auto;padding:24px 18px 64px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-size:27px;font-weight:900}.badge{background:#111827;color:#fff;border-radius:999px;padding:8px 11px;font-size:12px}.hero{background:white;border-radius:20px;padding:22px;box-shadow:0 12px 38px #0000000a;margin-bottom:16px}.hero h1{font-size:30px;margin:0 0 8px}.muted{color:#6b7280}.filters{display:grid;grid-template-columns:1.4fr .55fr .7fr .7fr auto;gap:9px;margin-top:18px}.filters input,.filters select{border:1px solid #d1d5db;border-radius:11px;padding:12px;background:#fff;width:100%}button{border:0;border-radius:11px;padding:12px 15px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.status{font-size:13px;color:#6b7280;margin-top:12px}.layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px #0000000a}.list{display:grid;gap:10px}.card{border:1px solid #e5e7eb;padding:14px;border-radius:14px;cursor:pointer}.card:hover{border-color:#9ca3af}.title{font-weight:800}.meta{font-size:12px;color:#6b7280;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.chip{border-radius:999px;padding:4px 8px;background:#f3f4f6}.scorechip{font-weight:800;background:#ecfdf5}.danger{background:#fef2f2;color:#991b1b}.score{display:flex;align-items:flex-end;gap:8px;margin:14px 0}.score strong{font-size:66px;line-height:.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#f9fafb;border-radius:12px;padding:11px}.metric span{font-size:12px;color:#6b7280}.metric b{display:block;font-size:18px;margin-top:4px}.risk{border-left:5px solid #2563eb;background:#eff6ff;border-radius:11px;padding:11px;margin-top:8px}.risk.c3{border-color:#d97706;background:#fffbeb}.risk.c4{border-color:#b91c1c;background:#fef2f2}.risk p{font-size:12px;color:#4b5563;margin:5px 0 0}.section{margin-top:20px}.empty{text-align:center;color:#6b7280;padding:30px}.sim{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sim input{border:1px solid #d1d5db;border-radius:10px;padding:10px;width:100%}.simout{background:#111827;color:#fff;border-radius:12px;padding:14px;margin-top:10px}.simout b{font-size:24px}.small{font-size:12px}.critical{background:#7f1d1d;color:#fff;padding:12px;border-radius:12px;margin:12px 0}.ok{background:#ecfdf5;color:#065f46;padding:12px;border-radius:12px;margin:12px 0}@media(max-width:900px){.layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters button{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.filters,.sim{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="brand">AstaPilot</div><div class="badge">v0.9 • App-ready core</div></div>
<section class="hero"><h1>Trova l'asta. Capisci il rischio. Decidi meglio.</h1><div class="muted">Aste scoperte automaticamente, documenti analizzati e criticità collegate alla fonte.</div>
<div class="filters"><input id="city" placeholder="Città, es. Napoli"><input id="province" placeholder="Prov."><input id="maxBid" type="number" placeholder="Budget max"><select id="scoreMin"><option value="">Qualsiasi score</option><option value="70">70+</option><option value="85">85+</option></select><button onclick="loadAuctions()">Cerca aste</button></div>
<div class="status" id="status">Connessione al motore AstaPilot…</div></section>
<div class="layout"><section class="panel"><h2>Opportunità</h2><div class="list" id="list"><div class="empty">Caricamento…</div></div></section><section class="panel" id="detail"><div class="empty">Seleziona un'asta per vedere analisi e fonti.</div></section></div>
</div>
<script>
const API='http://localhost:8000';
const euro=v=>v==null?'—':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);
const date=v=>v?new Date(v).toLocaleDateString('it-IT'):'—';
async function api(path,opt){const r=await fetch(API+path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadStatus(){try{let s=await api('/health');document.querySelector('#status').textContent=`${s.sources} fonti registrate • ${s.indexed_auctions} aste indicizzate${s.ingestion_running?' • aggiornamento in corso':''}`;}catch(e){document.querySelector('#status').textContent='Backend non raggiungibile: avvia FastAPI su localhost:8000.'}}
async function loadAuctions(){let q=new URLSearchParams({limit:'100'});let city=cityEl().value.trim(),prov=document.querySelector('#province').value.trim(),max=document.querySelector('#maxBid').value,score=document.querySelector('#scoreMin').value;if(city)q.set('city',city);if(prov)q.set('province',prov);if(max)q.set('max_bid',max);if(score)q.set('score_min',score);let box=document.querySelector('#list');box.innerHTML='<div class="empty">Ricerca…</div>';try{let r=await api('/auctions?'+q);box.innerHTML=r.items.length?r.items.map(a=>`<div class="card" onclick="show('${a.fingerprint}')"><div class="title">${esc(a.title||a.address||'Asta immobiliare')}</div><div class="meta"><span>${euro(a.minimum_bid||a.base_price)}</span><span>${date(a.auction_date)}</span><span>${esc(a.city||a.province||'')}</span>${a.asta_score!=null?`<span class="chip scorechip">Score ${a.asta_score}</span>`:''}${a.profile?`<span class="chip ${a.profile==='CRITICAL'?'danger':''}">${a.profile}</span>`:''}</div></div>`).join(''):'<div class="empty">Nessuna asta con questi filtri.</div>'}catch(e){box.innerHTML='<div class="empty">Impossibile caricare le aste.</div>'}}
function cityEl(){return document.querySelector('#city')} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function show(fp){let d=await api('/auctions/'+fp),a=d.auction,x=d.analysis,p=document.querySelector('#detail');let risks=(x?.all_risks||[]);let crit=(x?.critical_flags||[]);p.innerHTML=`<div class="muted small">${esc(a.court||'Tribunale da estrarre')} • ${esc(a.procedure_number||'procedura —')} • Lotto ${esc(a.lot_number||'—')}</div><h1>${esc(a.title||a.address||'Asta immobiliare')}</h1>${crit.length?`<div class="critical"><b>${crit.length} criticità C4</b><div class="small">Lo score economico non può compensare un rischio critico.</div></div>`:'<div class="ok"><b>Nessun flag C4 rilevato</b><div class="small">Continuano comunque a valere le verifiche indicate sotto.</div></div>'}<div class="grid"><div class="metric"><span>Offerta minima</span><b>${euro(a.minimum_bid)}</b></div><div class="metric"><span>Base</span><b>${euro(a.base_price)}</b></div><div class="metric"><span>Data asta</span><b>${date(a.auction_date)}</b></div></div>${x?`<div class="score"><strong>${x.asta_score??'—'}</strong><span>/100</span></div><div class="grid"><div class="metric"><span>Confidence</span><b>${x.confidence_score}%</b></div><div class="metric"><span>Profilo</span><b>${x.profile}</b></div><div class="metric"><span>Qualità dati</span><b>${a.quality_score??0}%</b></div></div><div class="section"><h3>Rischi e verifiche</h3>${risks.length?risks.map(r=>`<div class="risk ${r.severity.toLowerCase()}"><b>${r.severity} · ${esc(r.title)}</b><p>${esc(r.description)}</p><p>${r.source?`Fonte: ${esc(r.source.document)}${r.source.page?' · pag. '+r.source.page:''}`:'Fonte documentale non ancora localizzata'}</p></div>`).join(''):'<div class="muted">Nessun rischio rilevato automaticamente.</div>'}</div>`:''}<div class="section"><h3>Simula la tua offerta</h3><div class="sim"><input id="bid" type="number" value="${a.minimum_bid||a.base_price||''}" placeholder="Offerta"><input id="val" type="number" placeholder="Valore prudenziale"><input id="reno" type="number" placeholder="Lavori"><input id="other" type="number" placeholder="Altri costi"></div><button style="margin-top:8px" onclick="simulate()">Calcola soglia</button><div id="simout"></div></div>`}
async function simulate(){let body={bid:+document.querySelector('#bid').value,conservative_market_value:+document.querySelector('#val').value,renovation_cost:+document.querySelector('#reno').value||0,other_costs:+document.querySelector('#other').value||0};if(!body.bid||!body.conservative_market_value)return;let r=await api('/simulation',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});document.querySelector('#simout').innerHTML=`<div class="simout"><div class="small">Investimento totale stimato</div><b>${euro(r.total_investment)}</b><div class="small" style="margin-top:7px">Soglia personale: ${euro(r.personal_bid_limit)} • Margine lordo: ${euro(r.gross_margin)}</div>${r.warning?`<div class="small" style="margin-top:7px">⚠ ${esc(r.warning)}</div>`:''}</div>`}
loadStatus();loadAuctions();setInterval(loadStatus,20000);
</script></body></html>
